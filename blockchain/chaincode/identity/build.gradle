plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    // Hyperledger Fabric Chaincode Java SDK
    implementation 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    testImplementation 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.0'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

shadowJar {
    archiveBaseName = 'identity-chaincode'
    archiveVersion = project.version
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'com.cypherid.identity.IdentityChaincode'
    }
    mergeServiceFiles()
}

build.dependsOn shadowJar
