server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Patterns (not exact origins) so public preview tunnels work too.
            # Override via ALLOWED_ORIGIN_PATTERNS env (comma-separated) if needed.
            allowedOriginPatterns: "${ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://*.trycloudflare.com}"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - AddRequestHeader=X-Gateway-Version, 1.0
        - AddResponseHeader=X-Request-ID, ${spring.application.name}

      routes:
        # /me echoes the verified JWT claims (X-User-DID/Org/Roles) and the
        # downstream handler requires those headers, so this route MUST run
        # JwtAuthFilter. It precedes auth-login (first match wins) — otherwise
        # /me falls into the public route, arrives headerless, and 403s.
        - id: auth-me
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/auth/me
            - Method=GET
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@didKeyResolver}"

        # Auth routes — no JWT required (login/refresh/logout carry their own
        # credentials: password, refresh cookie, bearer token respectively)
        - id: auth-login
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # Public DID enrollment (self-service KYC registration, RegisterPage.jsx
        # -> POST /api/v1/identity/did). No JWT required: a brand-new user has
        # no token yet — that's the whole point of this endpoint. Must precede
        # the generic identity-service route below (first match wins), or the
        # JwtAuthFilter there swallows this path too and registration 401s for
        # everyone, permanently, with no way to create a first account.
        - id: identity-register
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/identity/did
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        # Identity routes
        - id: identity-service
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@didKeyResolver}"

        # (Credentials live under /api/v1/identity/credentials/**,
        # covered by the identity-service route above.)

        # Access control routes
        - id: access-service
          uri: http://${ACCESS_SVC_HOST:access-svc}:8082
          predicates:
            - Path=/api/v1/access/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@didKeyResolver}"

        # Asset routes
        - id: asset-service
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/assets/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Session-token content routes — NO JwtAuthFilter. /chunk and
        # /session-info authenticate with Bearer {sessionToken} (issued at
        # protected-session time after access evaluation), NOT the user JWT —
        # the filter would 401 every viewer call. The asset service validates
        # the session token itself. Must precede protected-content (first
        # match wins). Rate-limited by IP since no DID is available.
        - id: protected-content-session
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/protected-content/chunk,/api/v1/protected-content/session-info
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                key-resolver: "#{@ipKeyResolver}"

        # Protected content routes (session events + close need the user JWT)
        - id: protected-content
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/protected-content/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                key-resolver: "#{@didKeyResolver}"

        # Exam routes (asset-service ExamController)
        - id: exam-service
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/exams/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Video routes (asset-service VideoController)
        - id: video-service
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/videos/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Identity admin routes (org registry + role assignment) — must
        # precede the generic admin route below (first match wins). NOTE:
        # Path= with multiple patterns must be a single comma-separated
        # string with NO space after the comma — Spring's PathPatternParser
        # requires every pattern to start with "/", and a leading space
        # (from "X, Y") breaks that for the second pattern.
        - id: identity-admin
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/admin/organizations/**,/api/v1/admin/users/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Admin + security-event routes (asset-service AdminController)
        - id: admin-service
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/admin/**,/api/v1/security/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Notification routes (asset-service NotificationController)
        - id: notification-service
          uri: http://${ASSET_SVC_HOST:asset-svc}:8083
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        # Audit routes
        - id: audit-service
          uri: http://${AUDIT_SVC_HOST:audit-svc}:8084
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@didKeyResolver}"

        - id: audit-websocket
          uri: ws://${AUDIT_SVC_HOST:audit-svc}:8084
          predicates:
            - Path=/ws/audit

        # Health check — no auth
        - id: health
          uri: http://${IDENTITY_SVC_HOST:identity-svc}:8081
          predicates:
            - Path=/api/v1/health/**

# JWT Configuration
# NOTE: only jwt.secret is actually used here — the gateway validates the
# token's own embedded exp claim, it doesn't independently enforce a max
# age. expiration-seconds/refresh-expiration-seconds below are kept only to
# mirror identity-service's config for readability; the real values that
# matter are set in identity-service/src/main/resources/application.yml
# (JwtService is what actually issues tokens and sets their expiry).
jwt:
  secret: ${JWT_SECRET:CypherID-SIH-2026-Super-Secret-Key-Must-Be-At-Least-256-Bits-Long!}
  expiration-seconds: 18000       # 5 hours — must match identity-service
  refresh-expiration-seconds: 86400

logging:
  level:
    com.cypherid: DEBUG
    org.springframework.cloud.gateway: INFO
