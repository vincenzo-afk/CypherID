server:
  port: 8084
spring:
  config:
    activate:
      on-profile: demo
  application:
    name: audit-service
  datasource:
    url: jdbc:h2:mem:cypherid_audit_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration-demo
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.kafka.autoconfigure.KafkaAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.cypherid: DEBUG
