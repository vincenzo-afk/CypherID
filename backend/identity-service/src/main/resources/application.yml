server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:cypherid}
    username: ${POSTGRES_USER:cypherid}
    password: ${POSTGRES_PASSWORD:cypherid_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

# Hyperledger Fabric configuration
fabric:
  network-config-path: ${FABRIC_NETWORK_CONFIG:/config/fabric/connection-profile.yaml}
  channel-name: ${FABRIC_CHANNEL:cypherid-channel}
  org-msp-id: ${FABRIC_ORG_MSP:Org1MSP}
  admin-user: ${FABRIC_ADMIN_USER:admin}
  admin-password: ${FABRIC_ADMIN_PASSWORD:adminpw}
  ca-url: ${FABRIC_CA_URL:https://ca.org1.cypherid.com:7054}
  tls-cert-path: ${FABRIC_TLS_CERT:/config/fabric/tls/ca.crt}
  # Chaincode names
  identity-chaincode: identity
  access-chaincode: accesscontrol
  asset-chaincode: assetregistry

# JWT
jwt:
  secret: ${JWT_SECRET:CypherID-SIH-2026-Super-Secret-Key-Must-Be-At-Least-256-Bits-Long!}
  expiration-seconds: 900
  refresh-expiration-seconds: 86400

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cypherid: DEBUG
    org.hyperledger: INFO
    org.springframework.security: INFO
