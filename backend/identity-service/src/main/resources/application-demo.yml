# Demo profile — uses H2 embedded database, no Redis, no Kafka, no Fabric
# Run with: java -jar app.jar --spring.profiles.active=demo

server:
  port: 8081

spring:
  config:
    activate:
      on-profile: demo

  datasource:
    url: jdbc:h2:mem:cypherid_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration-demo
    baseline-on-migrate: true

  # Disable Redis (use ConcurrentHashMap caching instead)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092

# JWT
jwt:
  secret: CypherID-SIH-2026-Super-Secret-Key-Must-Be-At-Least-256-Bits-Long!
  expiration-seconds: 900
  refresh-expiration-seconds: 86400

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cypherid: DEBUG
    org.springframework.security: INFO
