server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the api-gateway service (same Docker network).
    # Keeps the frontend calling relative "/api/..." paths (see src/services/api.js)
    # in both dev (vite proxy) and this production nginx build.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (react-router-dom) don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
